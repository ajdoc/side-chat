[package]
name = "moba-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moba-proto = { workspace = true }
serde_json = "1"

# The browser half. Only pulled in for the wasm target, so `cargo test` on the host builds and
# tests the interesting logic without a browser anywhere in sight.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "WebSocket", "MessageEvent", "Event", "MouseEvent", "KeyboardEvent", "BinaryType",
  "WheelEvent",
  "Performance", "CssStyleDeclaration", "DomRect", "TouchEvent", "TouchList", "Touch",
]
