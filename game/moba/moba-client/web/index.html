<!doctype html>
<meta charset="utf-8">
<title>MOBA — dev harness</title>
<!--
  `viewport-fit` plus `user-scalable=no` because every default touch gesture fights the game for
  the same finger: a tap becomes a click 300ms late, a drag scrolls the page, and a double-tap
  zooms. The canvas wants all three.
-->
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<!--
  A bare page for playing the client before it lives inside a Side Chat app channel.
  Not the real UI: MobaApp.vue is phase 4. This exists so the netcode can be judged by
  playing it, which is the only way it can be judged.

  Two tabs against `MOBA_TEAM_SIZE=1` is a full match. On a phone, point it at the machine
  running the server: http://<your-ip>:9301/?server=ws://<your-ip>:930
-->
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d1017; color: #c9d1d9;
    font: 14px/1.5 ui-monospace, monospace;
    /* The game handles every gesture itself. */
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 6px 10px; border-bottom: 1px solid #21262d;
    display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px;
    padding-top: max(6px, env(safe-area-inset-top));
  }
  canvas { flex: 1; display: block; width: 100%; cursor: crosshair; touch-action: none; }
  kbd { background: #21262d; border-radius: 3px; padding: 1px 5px; }
  /* On a phone the on-screen bar is the control scheme, so the keyboard legend is noise. */
  @media (pointer: coarse) { .desktop-only { display: none; } }
</style>
<div id="wrap">
  <header>
    <span class="desktop-only"><kbd>right-click</kbd> move / attack</span>
    <span class="desktop-only"><kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> abilities</span>
    <span class="desktop-only"><kbd>1</kbd>–<kbd>6</kbd> items</span>
    <span class="desktop-only"><kbd>S</kbd> stop · <kbd>Esc</kbd> cancel</span>
    <span>tap to move · tap an ability then tap a target</span>
  </header>
  <canvas id="game-canvas"></canvas>
</div>
<script type="module">
  import init, { MobaGame } from "./pkg/moba_client.js";

  const canvas = document.getElementById("game-canvas");

  // The canvas backing store must match its displayed size, or every click lands somewhere other
  // than where it was aimed — the camera converts against canvas.width, not the CSS box.
  //
  // Deliberately *not* scaled by devicePixelRatio: on a phone that triples the pixel count for a
  // renderer that is currently coloured discs, and a smooth 60fps matters more here than crisp
  // edges. Revisit when there is art worth the resolution.
  function resize() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width));
    canvas.height = Math.max(1, Math.floor(rect.height));
  }
  resize();
  addEventListener("resize", resize);
  addEventListener("orientationchange", () => setTimeout(resize, 200));

  // Default to the host that served this page, so opening it from a phone on the same network
  // just works without editing anything.
  const url = new URLSearchParams(location.search).get("server")
    ?? `ws://${location.hostname}:930`;

  await init();
  new MobaGame("game-canvas", url, "dev-ticket").start();
</script>
